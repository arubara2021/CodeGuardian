# Pre-commit hooks run on every commit. Only fast checks live here; the test
# suite and the Rust build run in CI. A hook that modifies files exits
# non-zero, so the change must be re-staged and the commit re-run.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy python/codeguardian
        language: system
        pass_filenames: false
        files: ^python/codeguardian/.*\.py$
        types: [python]

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: \.rs$

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: \.rs$

      - id: validate-schemas
        name: validate JSON schemas
        entry: python scripts/validate_schemas.py
        language: system
        pass_filenames: false
        files: ^schemas/.*\.json$
