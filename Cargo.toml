[workspace]
resolver = "2"
members = ["rust/crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
authors = ["CodeGuardian Contributors"]
repository = "https://github.com/codeguardian/codeguardian"
homepage = "https://codeguardian.dev/"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tree-sitter = "0.24"
pyo3 = { version = "0.23" }
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
