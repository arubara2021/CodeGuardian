# Tester golden cases. Consumed by agent_eval.run_golden("tester", ...).
# Each case exercises a different target-function shape. Retry
# variables are present but empty on non-retry cases so the same file
# renders under prompt v1.0.0 and v1.1.0.

cases:
  - id: pass_simple_function
    description: Simple leaf function, no branches
    variables:
      target_symbol: parse
      target_path: a.py
      language: python
      directive: add type hints
      skeleton: |
        a.py:
        5: def parse(raw):
      blast_report: |
        {"direct_callers": [], "contract_violations": [], "blast_score": 0}
      previous_test_attempt: ""
      parse_error: ""
      old_code_failure: ""
    expected:
      expects_refusal: false
      expected_ast_valid: true
      expected_contains: ["def test_", "assert"]
      min_assertion_count: 1

