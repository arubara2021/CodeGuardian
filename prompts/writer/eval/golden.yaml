  - id: pass_retry_type_hints
    description: Retry case; previous attempt failed
    variables:
      target_symbol: parse
      target_path: a.py
      language: python
      directive: add type hints
      skeleton: |
        a.py:
        5: def parse(raw):
      blast_report: |
        {"direct_callers": [], "contract_violations": [], "blast_score": 0}
      characterization_test: |
        def test_parse():
            assert parse("x") == "x"
      previous_attempt: "def parse(data: str) -> str:\n    return data\n"
      test_failure: "TypeError: parse() got an unexpected keyword argument 'data'"
      previous_diff: "-def parse(raw): ...\n+def parse(data: str) -> str: ..."
    expected:
      expects_refusal: false
      expected_ast_valid: true
      expected_contains: ["def parse", "raw"]
      expected_compliance_score_min: 0.5
