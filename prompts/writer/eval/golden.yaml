# Writer golden cases. Consumed by agent_eval.run_golden("writer", ...).
# Retry variables empty on non-retry cases so the same file renders
# under prompt v1.0.0 and v1.1.0. expected_compliance_score_min is
# informational; agent_eval does not currently assert on it.

cases:
  - id: pass_add_type_hints
    description: Simple add type hints, signature preserved
    variables:
      target_symbol: parse
      target_path: a.py
      language: python
      directive: add type hints
      skeleton: |
        a.py:
        5: def parse(raw):
      blast_report: |
        {"direct_callers": [], "contract_violations": [], "blast_score": 0}
      characterization_test: |
        def test_parse():
            assert parse("x") == "x"
      previous_attempt: ""
      test_failure: ""
      previous_diff: ""
    expected:
      expects_refusal: false
      expected_ast_valid: true
      expected_contains: ["def parse", "raw", "str"]
      expected_compliance_score_min: 0.5

