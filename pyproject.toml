[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "codeguardian"
version = "1.0.0"
description = "Safety-first refactoring agent with structural understanding and independent verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "CodeGuardian Contributors" }]
keywords = ["refactoring", "code-analysis", "ai-agent", "mcp", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Refactoring",
]

dependencies = [
    # Orchestration and tracing.
    "langgraph>=0.2",
    "langsmith>=0.1",

    # Model provider SDKs. The application is provider-agnostic; these are the
    # three cloud families that ship in v1.
    "anthropic>=0.40",
    "openai>=1.50",

    # Model Context Protocol, used both as a client and as a server.
    "mcp>=1.0",

    # Async HTTP for provider calls and MCP transports.
    "httpx>=0.27",

    # JSON Schema validation for every artifact that crosses a component boundary.
    "jsonschema>=4.20",

    # OS keychain access for API keys. Keys never live in config files.
    "keyring>=25.0",

    # CLI rendering: Rich for panels, Textual for the full-screen TUI,
    # prompt_toolkit for advanced interactive input.
    "rich>=13.0",
    "textual>=0.80",
    "prompt-toolkit>=3.0",

    # TOML writing. Reading is stdlib tomllib on Python 3.11 and later.
    "tomli-w>=1.0",

    # Vector embeddings for the skill library. Loaded as a SQLite extension.
    "sqlite-vec>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "maturin>=1.7",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.0",
]

[project.scripts]
codeguardian = "codeguardian.cli.main:main"

[project.urls]
Homepage = "https://codeguardian.dev/"
Repository = "https://github.com/codeguardian/codeguardian"
Issues = "https://github.com/codeguardian/codeguardian/issues"

[tool.maturin]
# maturin builds the PyO3 extension module from the Rust workspace and merges
# it into the Python package at python/codeguardian/. The module-name determines
# the import path: `from codeguardian import _native`.
bindings = "pyo3"
python-source = "python"
module-name = "codeguardian._native"
manifest-path = "rust/crates/codeguardian-pyo3/Cargo.toml"
features = ["extension-module"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests"]
extend-exclude = ["tests/e2e/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    # Line length is enforced by the formatter, not the linter.
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["python/codeguardian"]
warn_unreachable = true
warn_no_return = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# These packages ship without complete type information. Ignoring missing
# imports for them keeps strict mode honest for the code we actually own.
module = [
    "sqlite_vec.*",
    "langgraph.*",
    "langchain.*",
    "langsmith.*",
    "mcp.*",
    "keyring.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "property: Property-based tests using Hypothesis or proptest.",
    "contract: Shared contract test suite for an interface.",
    "integration: Cross-module integration tests.",
    "e2e: End-to-end pipeline tests.",
    "slow: Tests that take more than a few seconds.",
]

[tool.coverage.run]
source = ["python/codeguardian"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.coverage.paths]
source = ["python/codeguardian", "*/site-packages/codeguardian"]
